name: Build and Deploy Blog

on:
  push:
    branches: [ main ] # 每次 push 到 main 分支時觸發
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (台灣時間早上 8 點) 自動定時執行打包
  workflow_dispatch: # 支援在 GitHub 網頁上點按鈕手動觸發

# 官方 Pages 部署需要的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一個部署，避免互相覆蓋
concurrency:
  group: pages
  cancel-in-progress: false

# 強制所有 JavaScript Actions 使用 Node24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v5

      - name: 安裝 Node.js 環境
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 安裝專案套件
        run: npm ci --include=dev

      - name: 執行 Notion 部落格打包
        env:
          NOTION_KEY: ${{ secrets.NOTION_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run build:blog

      - name: 一次複製所有靜態資源與頁面至 dist
        run: |
          rsync -av \
            --exclude='dist' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='build-blog.js' \
            --exclude='test-notion.js' \
            --exclude='package*.json' \
            ./ dist/

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 dist/ 為 Pages 檔案
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000 # 30 分鐘（單位：毫秒），預設只有 10 分鐘