name: Build and Deploy Blog

on:
  push:
    branches: [ main ] # 每次 push 到 main 分支時觸發
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (台灣時間早上 8 點) 自動定時執行打包
  workflow_dispatch: # 支援在 GitHub 網頁上點按鈕手動觸發

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝專案套件
        run: npm ci

      - name: 執行 Notion 部落格打包
        env:
          NOTION_KEY: ${{ secrets.NOTION_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run build:blog

      - name: 發布 dist/ 至 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist